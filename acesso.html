<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

<body>

                  <!--CRUD-->
  
<div id="logo" style="text-align: center;">

   <br>
</div>

<div id="form-acesso" style="text-align: center;">

                  <button type="submit" id="btn-entrar">Entrar</button>
          
</div>
<div style="text-align: center;">

  <button type="submit" id="btn-criar">Criar</button>
</div>
