<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Rafa's Burguer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="logo_tela_rafas.jpg" alt="Logo Rafa's Burguer">
    <h1><strong>Rafa's Burguer</strong></h1>

    <form>
      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" required>

      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <button type="submit" class="btn-entrar">ENTRAR</button>
      <button type="button" class="btn-cadastrar" onclick="window.location.href='criarcadastro.html'">CADASTRAR</button>
    </form>
  </div>
</body>
</html>
