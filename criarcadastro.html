<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Rafa's Burguer</title>
</head>
<body>
  <div style="text-align: center;">
    <img src="imagens/logo_telainicial.jpg" width="150" height="150" alt="Rafa's Burguer"><br>
   <br>
  <h1 >Rafa's Burguer Cadastro</h1>
  <form action="criarcadastro.html" method="POST">
    <label for="name">Nome:</label>
    <input type="text" id="name" name="name" required><br><br>

    <label for="age">Ano de Nascimento:</label>
    <input type="text" id="age" name="age" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">Senha:</label>
    <input type="password" id="password" name="password" required><br><br>

    <button type="submit">Criar Conta</button>
  </form>
  </div>
</body>
</html>
