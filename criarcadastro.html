<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Rafa's Burguer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="logo_tela_rafas.jpg" width="150" height="150" alt="Rafa's Burguer">
    <h1>Cadastro</h1>

    <form action="criarcadastro.html" method="POST">
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="endereco">Endereço de entrega:</label>
      <input type="text" id="endereco" name="endereco" required>

      <label for="aniversario">Data de aniversário:</label>
      <input type="date" id="aniversario" name="aniversario" required>

      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" required>

      <label for="senha">Senha (máx. 6 caracteres):</label>
      <input type="password" id="senha" name="senha" maxlength="6" required>

      <button type="submit">Criar Conta</button>
    </form>
  </div>
</body>
</html>
